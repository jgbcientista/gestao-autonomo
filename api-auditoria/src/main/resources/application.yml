server:
  port: ${SERVER_PORT:8081}
  servlet:
    session:
      timeout: 30m
  tomcat:
    connection-timeout: 5s
    max-connections: 200
    threads:
      max: 100
      min-spare: 10

spring:
  application:
    name: auditoria-service
  profiles:
    active: dev
  main:
    allow-bean-definition-overriding: true
  # Spring Security habilitado para funcionamento completo
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/auditoria_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 25
          fetch_size: 25
        order_inserts: true
        order_updates: true
        connection:
          provider_disables_autocommit: false
    open-in-view: false
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:joaoguedesdebrito@gmail.com}
    password: ${MAIL_PASSWORD:sua_senha_de_app}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8
    cache: false
    check-template-location: true

springdoc:
  api-docs:
    path: /api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operationsSorter: method
  show-actuator: true
  default-consumes-media-type: application/json
  default-produces-media-type: application/json
  # Configurações para evitar duplicação de path
  servers:
    url: http://localhost:8081
  # Não usar prefix automático
  use-management-port: false

jwt:
  secret: ${JWT_SECRET:***REMOVIDO***}
  expiration: ${JWT_EXPIRATION:86400000}

# Configurações de IA e Análise de Contexto
ai:
  service:
    url: ${AI_SERVICE_URL:}
    enabled: ${AI_SERVICE_ENABLED:false}

# Configurações de Geolocalização
geolocalizacao:
  opencage:
    api-key: ${OPENCAGE_API_KEY:}
  timeout: ${GEO_TIMEOUT:5000}
  fallback:
    enabled: ${GEO_FALLBACK_ENABLED:true}

# Configurações de Thresholds de Risco
risk:
  threshold:
    low: ${RISK_THRESHOLD_LOW:0.3}
    medium: ${RISK_THRESHOLD_MEDIUM:0.6}
    high: ${RISK_THRESHOLD_HIGH:0.8}

# Configurações de Blockchain - CONFIGURADO COM DADOS REAIS
blockchain:
  enabled: true  # ✅ HABILITADO para usar dados reais
  # Escolher implementação: hyperledger ou java-native
  native: 
    enabled: false  # Usando Hyperledger Fabric real
  network:
    type: hyperledger  # ✅ CONFIRMADO: Usando Hyperledger Fabric
    name: "fabric-test-network"  # ✅ Nome da rede real
    url: "http://localhost:7051"  # ✅ URL do peer
  private:
    key: ${BLOCKCHAIN_PRIVATE_KEY:}
  contract:
    address: ${BLOCKCHAIN_CONTRACT_ADDRESS:}
  confirmation:
    blocks: ${BLOCKCHAIN_CONFIRMATION_BLOCKS:12} # Número mínimo de confirmações
  hyperledger:
    # ✅ DADOS COLETADOS DA REDE REAL:
    channel: "mychannel"  # ✅ Canal padrão do test-network
    chaincode: "auth-audit"  # ✅ Nome do nosso chaincode
    organization: "Org1MSP"  # ✅ Organização 1 do test-network
    peer: "localhost:7051"  # ✅ Peer da Org1 (será configurado quando funcionar)
    ca-url: "https://localhost:7054"  # ✅ CA da Org1 REAL (rodando)
    orderer: "localhost:7050"  # ✅ Orderer (será configurado quando funcionar)
    user: "appUser"
    user-secret: "appUserSecret"
    admin-user: "admin"
    admin-secret: "adminpw"
    connection-profile-path: "src/main/resources/connection-profile.yaml"
    wallet-path: "wallet"
    certificate-path: ${HYPERLEDGER_CERT_PATH:}
    private-key-path: ${HYPERLEDGER_KEY_PATH:}
    tls-enabled: false  # ✅ AJUSTADO: false para test-network local
    simulation-mode: false  # ✅ IMPORTANTE: false para usar dados reais
    connection-timeout: 30
    retry-attempts: 3
  audit:
    enabled: true
    retention:
      days: 365 # Retenção de dados em dias

# Configurações Redis (apenas para produção)
redis:
  host: ${REDIS_HOST:localhost}
  port: ${REDIS_PORT:6379}
  password: ${REDIS_PASSWORD:}
  database: 0
  timeout: 2000ms
  lettuce:
    pool:
      max-active: 8
      max-idle: 8
      min-idle: 2
      max-wait: -1ms

logging:
  level:
    org.springframework.security: DEBUG
    br.com.auth: DEBUG
    org.web3j: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

---
# Profile de desenvolvimento com PostgreSQL (igual produção)
spring:
  config:
    activate:
      on-profile: dev
  # Usando PostgreSQL também em dev para evitar perda de dados do blockchain
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/auditoria_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
  jpa:
    hibernate:
      ddl-auto: update  # update em vez de create-drop para preservar dados
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 25
          fetch_size: 25
        order_inserts: true
        order_updates: true
        connection:
          provider_disables_autocommit: false
    open-in-view: false
  # CONFIGURAÇÕES H2 COMENTADAS - AGORA USANDO POSTGRESQL
  # h2:
  #   console:
  #     enabled: true
  #     path: /h2-console
  # Desabilita Redis no profile dev
  data:
    redis:
      repositories:
        enabled: false
  redis:
    host: 
    port: 
    password: 
    timeout: 0ms

# Configurações específicas do profile dev
ai:
  service:
    enabled: false

# Blockchain EXPLICITAMENTE habilitado em dev
blockchain:
  enabled: true
  network:
    type: hyperledger
  hyperledger:
    simulation-mode: true

# Redis desabilitado no profile dev

logging:
  level:
    org.springframework.security: INFO
    br.com.auth: INFO
    org.web3j: ERROR
    org.hibernate.SQL: INFO 

session:
  timeout:
    minutes: 30
  max-concurrent: 3
  cleanup:
    interval: 300000 # 5 minutos

app:
  base-url: ${APP_BASE_URL:http://localhost:4200}

---
# Profile de produção com PostgreSQL
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: jdbc:postgresql://localhost:5432/auditoria_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
  # Redis habilitado no profile prod
  data:
    redis:
      repositories:
        enabled: false
  redis:
    host: localhost
    port: 6379
    password: 
    timeout: 2000ms

# Configurações específicas do profile prod
ai:
  service:
    enabled: true
    timeout: 5000

blockchain:
  enabled: true

app:
  base-url: ${APP_BASE_URL:http://localhost:4200}

# Swagger habilitado no profile prod
springdoc:
  api-docs:
    enabled: true
    path: /api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operationsSorter: method
  show-actuator: true

logging:
  level:
    org.springframework.security: INFO
    br.com.auth: INFO
    org.web3j: INFO
    org.hibernate.SQL: INFO 

security:
  auto-block:
    max-suspicious-sessions: 3
    min-trust-score: 0.3
    suspicious-locations-threshold: 2
    check-interval: 60000 # 1 minuto

---
# Profile Keycloak - OAuth2 Resource Server
spring:
  config:
    activate:
      on-profile: keycloak
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/auditoria-system}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/auditoria-system/protocol/openid-connect/certs}

keycloak:
  realm: auditoria-system
  auth-server-url: ${KEYCLOAK_URL:http://localhost:8180}

---
# Profile ELK - Logging centralizado
spring:
  config:
    activate:
      on-profile: elk

logging:
  level:
    org.springframework.security: INFO
    br.com.auth: INFO
    org.web3j: INFO
    org.hibernate.SQL: INFO