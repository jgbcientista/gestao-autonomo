services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: auditoria-postgres
    environment:
      POSTGRES_DB: auditoria_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - auditoria-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend (Spring Boot API)
  api:
    build:
      context: ./api-auditoria
      dockerfile: Dockerfile
    container_name: auditoria-api
    ports:
      - "8080:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - DB_URL=jdbc:postgresql://postgres:5432/auditoria_db
      - SERVER_PORT=8081
      - DB_USERNAME=postgres
      - DB_PASSWORD=postgres
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - auditoria-network

  # Frontend (Angular + Nginx)
  frontend:
    build:
      context: ./front-auditoria
      dockerfile: Dockerfile.frontend
      args:
        CONFIGURATION: production
    container_name: auditoria-frontend
    ports:
      - "4200:4200"
    depends_on:
      - api
    networks:
      - auditoria-network

volumes:
  postgres_data:

networks:
  auditoria-network:
    driver: bridge
