services:
  # Backend (Spring Boot API)
  api:
    build:
      context: ./api-auditoria
      dockerfile: Dockerfile
    container_name: auditoria-api
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - DB_URL=jdbc:postgresql://postgres:5432/auditoria_db
      - SERVER_PORT=8080
      - DB_USERNAME=postgres
      - DB_PASSWORD=postgres
    networks:
      - auditoria-network

  # Frontend (Angular + Nginx)
  frontend:
    build:
      context: ./front-auditoria
      dockerfile: Dockerfile.frontend
      args:
        CONFIGURATION: production
    container_name: auditoria-frontend
    ports:
      - "4200:4200"
    depends_on:
      - api
    networks:
      - auditoria-network

networks:
  auditoria-network:
    driver: bridge
