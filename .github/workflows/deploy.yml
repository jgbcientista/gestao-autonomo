name: CI/CD - Build & Deploy

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  REGISTRY: ghcr.io
  API_IMAGE: ghcr.io/${{ github.repository }}/api
  FRONTEND_IMAGE: ghcr.io/${{ github.repository }}/frontend

jobs:
  # ============================================
  # JOB 1: Build e Teste do Backend (Spring Boot)
  # ============================================
  build-api:
    name: Build API (Spring Boot)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build e Testes
        working-directory: ./api-auditoria
        run: ./mvnw clean package -B

      - name: Upload artefato JAR
        uses: actions/upload-artifact@v4
        with:
          name: api-jar
          path: api-auditoria/target/*.jar
          retention-days: 1

  # ============================================
  # JOB 2: Build e Teste do Frontend (Angular)
  # ============================================
  build-frontend:
    name: Build Frontend (Angular)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: front-auditoria/package-lock.json

      - name: Instalar dependências
        working-directory: ./front-auditoria
        run: npm ci

      - name: Build produção
        working-directory: ./front-auditoria
        run: npm run build -- --configuration=production

      - name: Upload artefato build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: front-auditoria/dist/
          retention-days: 1

  # ============================================
  # JOB 3: Build e Push das Imagens Docker
  # ============================================
  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [build-api, build-frontend]
    if: github.event_name == 'push'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e Push - API
        uses: docker/build-push-action@v5
        with:
          context: ./api-auditoria
          file: ./api-auditoria/Dockerfile
          push: true
          tags: |
            ${{ env.API_IMAGE }}:latest
            ${{ env.API_IMAGE }}:${{ github.sha }}

      - name: Build e Push - Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./front-auditoria
          file: ./front-auditoria/Dockerfile.frontend
          build-args: CONFIGURATION=production
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}

  # ============================================
  # JOB 4: Deploy na VPS
  # ============================================
  deploy:
    name: Deploy na VPS
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Copiar arquivos para VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          source: "docker-compose.prod.yml,.env.production"
          target: "~/auditoria-app"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            cd ~/auditoria-app

            # Login no GitHub Container Registry
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Pull das imagens novas
            docker pull ${{ env.API_IMAGE }}:latest
            docker pull ${{ env.FRONTEND_IMAGE }}:latest

            # Parar containers antigos e subir novos
            docker compose -f docker-compose.prod.yml down
            docker compose -f docker-compose.prod.yml up -d

            # Limpar imagens antigas
            docker image prune -f

            # Verificar se os containers estão rodando
            sleep 10
            docker compose -f docker-compose.prod.yml ps
