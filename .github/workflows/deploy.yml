name: CI/CD - Build & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  API_IMAGE: ghcr.io/${{ github.repository }}/api
  FRONTEND_IMAGE: ghcr.io/${{ github.repository }}/frontend

jobs:
  # ============================================
  # JOB 0: Incrementar Versao
  # ============================================
  version:
    name: Incrementar Versao
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: write
    outputs:
      version: ${{ steps.bump.outputs.version }}

    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Incrementar versao
        id: bump
        run: |
          CURRENT=$(cat VERSION | tr -d '[:space:]')
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          PATCH=$((PATCH + 1))
          NEW_VERSION="$MAJOR.$MINOR.$PATCH"
          echo "$NEW_VERSION" > VERSION
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "Versao: $CURRENT -> $NEW_VERSION"

      - name: Atualizar versao nos environments do frontend
        run: |
          VERSION=$(cat VERSION | tr -d '[:space:]')
          sed -i "s/appVersion: '[^']*'/appVersion: '$VERSION'/" front-auditoria/src/environments/environment.ts
          sed -i "s/appVersion: '[^']*'/appVersion: '$VERSION'/" front-auditoria/src/environments/environment.prod.ts

      - name: Commit versao
        run: |
          VERSION=$(cat VERSION | tr -d '[:space:]')
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add VERSION front-auditoria/src/environments/environment.ts front-auditoria/src/environments/environment.prod.ts
          git diff --cached --quiet || git commit -m "release: v$VERSION [skip ci]"
          git push

  # ============================================
  # JOB 1: Build e Teste do Backend (Spring Boot)
  # ============================================
  build-api:
    name: Build API (Spring Boot)
    runs-on: ubuntu-latest
    needs: [version]
    if: always() && (needs.version.result == 'success' || needs.version.result == 'skipped')

    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build e Testes
        working-directory: ./api-auditoria
        run: ./mvnw clean package -B

      - name: Upload artefato JAR
        uses: actions/upload-artifact@v4
        with:
          name: api-jar
          path: api-auditoria/target/*.jar
          retention-days: 1

  # ============================================
  # JOB 2: Build e Teste do Frontend (Angular)
  # ============================================
  build-frontend:
    name: Build Frontend (Angular)
    runs-on: ubuntu-latest
    needs: [version]
    if: always() && (needs.version.result == 'success' || needs.version.result == 'skipped')

    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Configurar Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: front-auditoria/package-lock.json

      - name: Instalar dependencias
        working-directory: ./front-auditoria
        run: npm ci

      - name: Build producao
        working-directory: ./front-auditoria
        run: npm run build -- --configuration=production

      - name: Upload artefato build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: front-auditoria/dist/
          retention-days: 1

  # ============================================
  # JOB 3: Build e Push das Imagens Docker
  # ============================================
  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [build-api, build-frontend]
    if: github.event_name == 'push'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e Push - API
        uses: docker/build-push-action@v5
        with:
          context: ./api-auditoria
          file: ./api-auditoria/Dockerfile
          push: true
          tags: |
            ${{ env.API_IMAGE }}:latest
            ${{ env.API_IMAGE }}:${{ github.sha }}

      - name: Build e Push - Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./front-auditoria
          file: ./front-auditoria/Dockerfile.frontend
          build-args: CONFIGURATION=production
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}

  # ============================================
  # JOB 4: Deploy na VPS
  # ============================================
  deploy:
    name: Deploy na VPS
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main')

    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      # O .env.production nao fica mais no repositorio: vem do secret ENV_PRODUCTION
      # (conteudo completo do arquivo). Sem ele o deploy para aqui, sem tocar na VPS.
      - name: Gerar .env.production a partir do secret
        env:
          ENV_PRODUCTION: ${{ secrets.ENV_PRODUCTION }}
        run: |
          if [ -z "$ENV_PRODUCTION" ]; then
            echo "::error::Secret ENV_PRODUCTION nao configurado"
            exit 1
          fi
          printf '%s\n' "$ENV_PRODUCTION" > .env.production

      - name: Copiar arquivos para VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT }}
          source: "docker-compose.prod.yml,.env.production"
          target: "/home/sistema-autonomo"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            cd /home/sistema-autonomo

            # Login no GitHub Container Registry
            echo ${{ secrets.GHCR_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Pull da imagem da API
            docker pull ${{ env.API_IMAGE }}:latest

            # Atualizar codigo para build local do frontend
            git pull origin main

            # Parar containers antigos e subir novos (frontend faz build local)
            docker compose -f docker-compose.prod.yml down
            docker compose -f docker-compose.prod.yml up -d --build

            # Limpar imagens antigas
            docker image prune -f

            # Verificar se os containers estao rodando
            sleep 10
            docker compose -f docker-compose.prod.yml ps
