services:
  # Backend (Spring Boot API)
  api:
    image: ghcr.io/jgbcientista/sistema-autonomo/api:latest
    container_name: auditoria-api
    env_file: .env.production
    ports:
      - "8080:8080"
    networks:
      - auditoria-network
    restart: always

  # Frontend (Angular + Nginx)
  frontend:
    image: ghcr.io/jgbcientista/sistema-autonomo/frontend:latest
    container_name: auditoria-frontend
    ports:
      - "4200:4200"
    depends_on:
      - api
    networks:
      - auditoria-network
    restart: always

networks:
  auditoria-network:
    driver: bridge
