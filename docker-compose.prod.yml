services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: auditoria-postgres
    env_file: .env.production
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - auditoria-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  # Backend (Spring Boot API)
  api:
    image: ghcr.io/jgbcientista/sistema-autonomo-autenticacao-blockchain-ia/api:latest
    container_name: auditoria-api
    env_file: .env.production
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - auditoria-network
    restart: always

  # Frontend (Angular + Nginx)
  frontend:
    image: ghcr.io/jgbcientista/sistema-autonomo-autenticacao-blockchain-ia/frontend:latest
    container_name: auditoria-frontend
    ports:
      - "4200:4200"
    depends_on:
      - api
    networks:
      - auditoria-network
    restart: always

volumes:
  postgres_data:

networks:
  auditoria-network:
    driver: bridge
